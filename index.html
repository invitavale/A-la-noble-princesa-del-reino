<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:title" content="De Dama a Reina: Reflejando mi Corona">
<meta property="og:image" content="invitacion.jpg">
<title>De Dama a Reina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap">
<style>
/* Layout: una sola pantalla — portada (toque) → video a pantalla completa → invitación centrada sobre su propia escena desenfocada */
:root {
  --ink: #2a1418;         /* fondo vino profundo */
  --wine: #6e2433;
  --parchment: #f3e6dc;
  --gold: #d9b77a;
  --gold-soft: rgba(217, 183, 122, .55);
  --script: "Great Vibes", "Snell Roundhand", "Apple Chancery", cursive;
  --serif: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--ink); color: var(--parchment);
  font-family: var(--serif); overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
.stage { position: fixed; inset: 0; overflow: hidden; background: var(--ink); }

/* ---------- Video ---------- */
#video {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; background: var(--ink);
  transition: opacity 1.4s ease, filter 1.4s ease, transform 1.6s ease;
}
.stage.reveal #video { opacity: 0; filter: blur(14px) brightness(.7); transform: scale(1.06); }

/* ---------- Portada (toque para abrir) ---------- */
#gate {
  position: absolute; inset: 0; z-index: 5;
  display: grid; place-items: center; cursor: pointer;
  background:
    radial-gradient(ellipse at 50% 45%, rgba(42,20,24,.25), rgba(42,20,24,.85) 75%),
    url("poster.jpg") center / cover no-repeat;
  transition: opacity 1s ease, visibility 1s;
  border: 0; padding: 0; width: 100%; color: inherit; font: inherit;
}
#gate.gone { opacity: 0; visibility: hidden; pointer-events: none; }
.gate-inner {
  display: grid; justify-items: center; gap: 14px; text-align: center;
  padding-inline: 24px;
}
.gate-kicker {
  font-size: .8rem; letter-spacing: .32em; text-transform: uppercase;
  color: var(--gold);
}
.gate-title {
  font-family: var(--script); font-weight: 400; margin: 0;
  font-size: clamp(2.8rem, 12vw, 4.6rem); line-height: 1;
  color: var(--parchment); text-shadow: 0 2px 18px rgba(0,0,0,.55);
  text-wrap: balance;
}
.seal {
  width: 92px; height: 92px; border-radius: 50%; margin-top: 18px;
  display: grid; place-items: center;
  background: radial-gradient(circle at 35% 30%, #9a3446, var(--wine) 60%, #4a1520);
  box-shadow: 0 6px 22px rgba(0,0,0,.5), inset 0 -4px 10px rgba(0,0,0,.35), inset 0 3px 6px rgba(255,255,255,.15);
  position: relative;
}
.seal::before, .seal::after {
  content: ""; position: absolute; inset: -10px; border-radius: 50%;
  border: 1px solid var(--gold-soft); animation: ring 2.4s ease-out infinite;
}
.seal::after { animation-delay: 1.2s; }
.seal svg { width: 46px; height: 46px; }
.gate-hint { font-style: italic; font-size: 1.15rem; color: var(--parchment); opacity: .9; margin-top: 8px; }
@keyframes ring { from { transform: scale(.85); opacity: 1; } to { transform: scale(1.5); opacity: 0; } }

/* ---------- Invitación ---------- */
#card {
  position: absolute; inset: 0; z-index: 3;
  display: grid; place-items: center;
  padding: max(14px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom));
  visibility: hidden; opacity: 0;
}
#card::before { /* escena desenfocada detrás */
  content: ""; position: absolute; inset: -40px;
  background: url("fondo.jpg") center / cover no-repeat;
  filter: blur(22px) brightness(.55) saturate(1.1);
}
.stage.reveal #card { visibility: visible; opacity: 1; transition: opacity 1.2s ease .3s; }

.paper {
  position: relative;
  width: min(100%, calc((100svh - 28px) * 2 / 3), 620px);
  aspect-ratio: 2 / 3; max-width: 100%;
  box-shadow: 0 30px 70px rgba(0,0,0,.55), 0 0 0 1px rgba(217,183,122,.25);
  border-radius: 3px; overflow: hidden;
  opacity: 0; transform: translateY(40px) scale(.92) rotateX(8deg);
  clip-path: inset(0 0 100% 0);
}
@supports not (height: 100svh) {
  .paper { width: min(100%, calc((100vh - 28px) * 2 / 3), 620px); }
}
.stage.reveal .paper {
  animation: unroll 1.8s cubic-bezier(.2,.8,.2,1) .7s forwards;
}
@keyframes unroll {
  0%   { opacity: 0; transform: translateY(40px) scale(.92); clip-path: inset(0 0 100% 0); }
  25%  { opacity: 1; }
  100% { opacity: 1; transform: none; clip-path: inset(0 0 0 0); }
}
.paper img { display: block; width: 100%; height: 100%; object-fit: cover; }

/* destello dorado que barre la tarjeta al aparecer */
.paper::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(110deg, transparent 35%, rgba(255,236,190,.55) 50%, transparent 65%);
  transform: translateX(-120%);
}
.stage.reveal .paper::after { animation: sheen 1.6s ease-in-out 2.4s forwards; }
@keyframes sheen { to { transform: translateX(120%); } }

/* zona de ubicación (icono + texto) */
.map-link {
  position: absolute; z-index: 2;
  left: 26.5%; top: 73.9%; width: 46.5%; height: 5%;
  border-radius: 10px; outline-offset: 2px;
}
.map-link:focus-visible { outline: 2px solid var(--wine); }
.map-link .pulse {
  position: absolute; left: 5.4%; top: 50%; width: 30px; height: 30px;
  margin: -15px 0 0 -15px; border-radius: 50%;
  border: 2px solid rgba(110,36,51,.6);
  animation: pin 2s ease-out infinite; animation-delay: 4s; opacity: 0;
}
.stage:not(.reveal) .map-link .pulse { animation: none; }
@keyframes pin { 0% { transform: scale(.6); opacity: .9; } 100% { transform: scale(1.7); opacity: 0; } }
@media (hover: hover) { .map-link:hover { background: rgba(110,36,51,.07); } }

/* ---------- Botones flotantes ---------- */
.fab {
  position: fixed; z-index: 10; right: 14px;
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  width: 44px; height: 44px; border-radius: 50%;
  display: grid; place-items: center; cursor: pointer;
  border: 1px solid var(--gold-soft); color: var(--gold);
  background: rgba(42,20,24,.6); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
.fab svg { width: 20px; height: 20px; }
.fab:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
#skip {
  position: fixed; z-index: 10; left: 14px;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  background: none; border: 0; color: var(--parchment); opacity: .7;
  font: italic 1rem var(--serif); letter-spacing: .04em; cursor: pointer;
}

@media (prefers-reduced-motion: reduce) {
  .seal::before, .seal::after, .map-link .pulse { animation: none; }
  .stage.reveal .paper { animation-duration: .01s; animation-delay: 0s; }
  .stage.reveal .paper::after { animation: none; }
}
</style>
</head>
<body>

<div class="stage" id="stage">
  <video id="video" src="video.mp4" poster="poster.jpg" muted playsinline webkit-playsinline preload="auto"></video>

  <div id="card" aria-live="polite">
    <div class="paper">
      <img src="invitacion.jpg" alt="Invitación: De Dama a Reina, Reflejando mi Corona. Domingo 29 de noviembre de 2026 a las 3:00 p. m., Salón de Eventos de la Catedral, San Pedro de Macorís. Con cariño, Dra. Karen Eusebio." decoding="async">
      <a class="map-link" href="https://maps.app.goo.gl/RrfmAye3DrNBonQb7" target="_blank" rel="noopener" aria-label="Abrir ubicación en Google Maps: Salón de Eventos de la Catedral, San Pedro de Macorís">
        <span class="pulse"></span>
      </a>
    </div>
  </div>

  <button id="gate" type="button" aria-label="Abrir invitación">
    <span class="gate-inner">
      <span class="gate-kicker">Una invitación para usted</span>
      <span class="gate-title">De Dama a Reina</span>
      <span class="seal" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none" stroke="#e9cf9a" stroke-width="2" stroke-linejoin="round">
          <path d="M8 34 L6 16 L16 24 L24 10 L32 24 L42 16 L40 34 Z" fill="rgba(233,207,154,.15)"/>
          <path d="M9 39 H39"/>
          <circle cx="24" cy="9" r="2" fill="#e9cf9a"/>
          <circle cx="6" cy="15" r="1.6" fill="#e9cf9a"/>
          <circle cx="42" cy="15" r="1.6" fill="#e9cf9a"/>
        </svg>
      </span>
      <span class="gate-hint">Toque la pantalla para abrir</span>
    </span>
  </button>
</div>

<button id="skip" type="button" hidden>Saltar video ›</button>
<button class="fab" id="sound" type="button" aria-label="Silenciar música" hidden>
  <svg id="ico-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="none"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>
  <svg id="ico-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" hidden><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="none"/><path d="M16 9l5 6M21 9l-5 6"/></svg>
</button>

<audio id="music" src="musica.mp3" preload="auto" loop playsinline></audio>

<script>
(function () {
  var stage = document.getElementById('stage');
  var gate  = document.getElementById('gate');
  var video = document.getElementById('video');
  var music = document.getElementById('music');
  var skip  = document.getElementById('skip');
  var sound = document.getElementById('sound');
  var icoOn = document.getElementById('ico-on');
  var icoOff = document.getElementById('ico-off');
  var started = false, revealed = false, userMuted = false;

  // iOS/Safari: el video debe estar silenciado para reproducirse en línea
  video.muted = true;
  video.defaultMuted = true;
  video.setAttribute('muted', '');

  function reveal() {
    if (revealed) return;
    revealed = true;
    skip.hidden = true;
    stage.classList.add('reveal');
    setTimeout(function () { try { video.pause(); } catch (e) {} }, 1500);
  }

  function start() {
    if (started) return;
    started = true;

    // Safari exige que play() se llame directamente dentro del gesto del usuario.
    music.volume = 1;
    var p = music.play();
    if (p && p.catch) p.catch(function () {
      // Si el navegador lo bloquea, se reintenta en el próximo toque.
      document.addEventListener('touchend', retry, { once: true });
      document.addEventListener('click', retry, { once: true });
    });

    var v = video.play();
    if (v && v.catch) v.catch(function () { reveal(); });

    gate.classList.add('gone');
    sound.hidden = false;
    setTimeout(function () { if (!revealed) skip.hidden = false; }, 1500);

    // Respaldo: si el video se queda trabado, mostrar la invitación igual
    var guard = setInterval(function () {
      if (revealed) return clearInterval(guard);
      if (video.ended) { clearInterval(guard); reveal(); }
    }, 500);
    setTimeout(reveal, 16000);
  }

  function retry() { if (!userMuted) music.play().catch(function () {}); }

  gate.addEventListener('click', start);
  video.addEventListener('ended', reveal);
  video.addEventListener('timeupdate', function () {
    // Empieza la transición un poco antes del final para que sea fluida
    if (video.duration && video.currentTime >= video.duration - 0.35) reveal();
  });
  video.addEventListener('error', reveal);
  skip.addEventListener('click', reveal);

  function setIcons() {
    var muted = music.paused || userMuted;
    icoOn.hidden = muted; icoOff.hidden = !muted;
    sound.setAttribute('aria-label', muted ? 'Activar música' : 'Silenciar música');
  }
  sound.addEventListener('click', function () {
    if (music.paused) { userMuted = false; music.play().catch(function () {}); }
    else { userMuted = true; music.pause(); }
    setIcons();
  });
  music.addEventListener('play', setIcons);
  music.addEventListener('pause', setIcons);

  // Pausar al salir de la pestaña (p. ej. al abrir Maps) y reanudar al volver
  document.addEventListener('visibilitychange', function () {
    if (!started) return;
    if (document.hidden) { music.pause(); }
    else if (!userMuted) { music.play().catch(function () {}); }
  });
})();
</script>
</body>
</html>
